<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Intizom</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">INTIZOM</span>
      </div>
      <div class="score-chip" id="totalPoints">— ball</div>
    </header>

    <!-- Tab navigatsiya -->
    <nav class="tabs">
      <button class="tab active" data-tab="home">Bosh</button>
      <button class="tab" data-tab="challenges">Challenge</button>
      <button class="tab" data-tab="board">Reyting</button>
    </nav>

    <main class="content">
      <!-- HOME -->
      <section class="view active" id="view-home">
        <div id="myChallenges"></div>
        <div class="empty" id="homeEmpty" hidden>
          <div class="empty-icon">◇</div>
          <p>Hali challenge tanlamagansiz.</p>
          <button class="btn-ghost" data-goto="challenges">Challenge tanlash</button>
        </div>
      </section>

      <!-- CHALLENGES -->
      <section class="view" id="view-challenges">
        <p class="section-hint">Challenge tanlang va har kuni belgilang.</p>
        <div id="challengeList"></div>
      </section>

      <!-- LEADERBOARD -->
      <section class="view" id="view-board">
        <div class="board-picker" id="boardPicker"></div>
        <div id="leaderboard"></div>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
